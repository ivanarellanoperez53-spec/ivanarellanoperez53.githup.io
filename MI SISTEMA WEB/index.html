<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurante Ivan</title>

  <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="background-circle circle-one"></div>
<div class="background-circle circle-two"></div>
<div class="background-circle circle-three"></div>

<div class="login-container">

    <div class="logo">
        <img  class="logo" src="img/LOGO.jpg" alt="">
    </div>

    <h1>Bienvenido</h1>
    <p class="subtitle">RESTAURANTE  IVAN</p>

    <form id="formLogin">

        <div class="input-box">
            <input type="text" id="usuario"
                   placeholder="Usuario"
                   required>
        </div>

        <div class="input-box">
            <input type="password" id="clave"
                   placeholder="Contraseña"
                   required>
          <button class="b" type="button" id="verClave" aria-label="Mostrar contraseña">Ver</button>
        </div>

        <button type="submit" class="login-btn">
            Ingresar
            <i class="fa-solid fa-arrow-right"></i>
        </button>

        <p class="message" id="mensaje"></p>

    </form>

    

</div>
<script src="js/script.js"></script>
</body>
</html>
